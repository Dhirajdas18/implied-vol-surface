name: Surface lab
on:
  push:
    branches: [main]
  workflow_dispatch:
# No schedule: CI can't download NSE's option archive reliably, so the page is built only from the
# committed docs/data/lab_surfaces.json, which changes when the studies are rerun locally.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false  # never cut off a deploy halfway
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python scripts/build_site.py  # reads the committed JSON, under a second
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
